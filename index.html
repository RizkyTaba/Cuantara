function resetSheet(){sheet(`<h3>Hapus semua data?</h3><p>Semua transaksi, dompet, anggaran, dan target akan dihapus permanen.</p><button class="btn dg" onclick="resetAll()">Ya, hapus semua</button><button class="btn" onclick="closeS()">Batal</button>`)}
function resetAll(){S={acc:[{id:'a1',n:'Tunai',b:0}],tx:[],bud:{},goals:[]};done()}

function txSheet(id,ty){D=id?{...S.tx.find(t=>t.id==id)}:{t:'out',a:S.acc[0].id,to:(S.acc[1]||S.acc[0]).id,c:OUT[0],m:'',d:today(),n:''};if(!id&&ty){D.t=ty;D.c=ty=='in'?INC[0]:ty=='tf'?'Transfer':OUT[0]}drawTx()}
function addAmt(v){const e=$('#fm');e.value=((+e.value.replace(/\D/g,''))+v).toLocaleString('id-ID')}
function sync(){['m','d','n','c','a','to'].forEach(k=>{const e=$('#f'+k);if(e)D[k]=e.value})}
function setT(t){sync();D.t=t;D.c=t=='in'?INC[0]:t=='out'?OUT[0]:'Transfer';drawTx()}
function drawTx(){
 const o=(arr,v)=>arr.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join(''),ac=v=>S.acc.map(a=>`<option value="${a.id}" ${a.id==v?'selected':''}>${E(a.n)}</option>`).join('');
 sheet(`<h3>${D.id?'Ubah':'Tambah'} transaksi</h3><div class="seg">${[['out','Keluar'],['in','Masuk'],['tf','Transfer']].map(([k,n])=>`<button class="${D.t==k?'on':''}" onclick="setT('${k}')">${n}</button>`).join('')}</div>
 <label>Jumlah (Rp)</label><input class="fi" id="fm" inputmode="numeric" value="${D.m}" placeholder="0"><div class="chips">${[10000,50000,100000,500000].map(v=>`<button onclick="addAmt(${v})">+${v/1000}rb</button>`).join('')}</div>
 ${D.t!='tf'?`<label>Kategori</label><select class="fi" id="fc">${o(D.t=='in'?INC:OUT,D.c)}</select>`:''}
 <label>${D.t=='tf'?'Dari dompet':'Dompet'}</label><select class="fi" id="fa">${ac(D.a)}</select>
 ${D.t=='tf'?`<label>Ke dompet</label><select class="fi" id="fto">${ac(D.to)}</select>`:''}
 <label>Tanggal</label><input class="fi" id="fd" type="date" value="${D.d}">
 <label>Catatan</label><input class="fi" id="fn" value="${E(D.n)}" placeholder="Opsional">
 <button class="btn" onclick="saveTx()">Simpan</button>${D.id?`<button class="btn ghost" onclick="dupTx()">Duplikat ke hari ini</button><button class="btn dg" onclick="delTx()">Hapus transaksi</button>`:''}`)}
function saveTx(){
 sync();const m=+String(D.m).replace(/\D/g,'');
 if(!m)return toast('Isi jumlah dulu');if(D.t=='tf'&&D.a==D.to)return toast('Dompet asal dan tujuan sama');
 const t={...D,m,d:D.d||today(),c:D.t=='tf'?'Transfer':D.c};
 if(t.id)S.tx=S.tx.map(x=>x.id==t.id?t:x);else{t.id=uid();t.ts=Date.now();S.tx.push(t)}
 M=t.d.slice(0,7);HL=t.id;done();HL=null;toast('Tersimpan')}
let UN;function delTx(){UN=S.tx.find(x=>x.id==D.id);S.tx=S.tx.filter(x=>x.id!=D.id);done();toast('Transaksi dihapus',1)}
function undo(){if(UN){S.tx.push(UN);UN=null;save();render();toast('Dikembalikan')}}
document.querySelectorAll('nav button').forEach(b=>b.firstChild.innerHTML=I({home:'home',tx:'list',bud:'chart',goal:'target',more:'wallet'}[b.dataset.v]));$('.fab').innerHTML=I('plus');
document.body.insertAdjacentHTML('beforeend','<div id="lk"></div>');runRec();save();setInterval(chk,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});setTimeout(chk,800);if(PIN)lock('unlock');
render(1);
</script><script>if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script></body></html>
